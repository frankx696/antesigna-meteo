<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chi comanda il tempo</title>
<meta name="theme-color" content="#000000">
<style>
/* ===== Modulo "Chi comanda il tempo" – tutto lo stile è sotto .cc per non toccare l'applicazione ===== */
:root{color-scheme:dark}
html,body{margin:0;background:#000;color:#e6e8eb;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.cc{--bg:#000;--card:#111419;--card2:#171b21;--line:#262a30;--line2:#323843;--tx:#e6e8eb;--mu:#8b949e;--mu2:#6e7781;--ac:#4da3ff;--ac2:#9cc9ff;
  --v-pioggia:#4da3ff;--v-temperatura:#ff7466;--v-vento:#5fe0b6;--v-umidita:#cfd6de;
  color:var(--tx);font-size:15px;line-height:1.45;padding:14px 16px calc(28px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;box-sizing:border-box}
.cc *{box-sizing:border-box}
.cc button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.cc-h1{font-size:24px;font-weight:700;letter-spacing:-.01em;margin:4px 0 2px}
.cc-sub{color:var(--mu);font-size:14px;margin:0 0 12px}
.cc-esempio{display:inline-block;margin:0 0 10px;padding:4px 10px;border-radius:999px;background:#3a2a12;color:#ffd166;font-size:12px;font-weight:600}
.cc-seg{display:flex;background:#15181d;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin:0 0 12px}
.cc-seg button{flex:1;min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--mu);font-weight:600;font-size:15px}
.cc-seg button[aria-pressed=true]{background:#13263a;color:#fff;box-shadow:inset 0 0 0 1px #1f3a57}
.cc-frase{font-size:15px;line-height:1.5;margin:0 0 12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--ac)}
.cc-frase b{color:#fff}
/* striscia dei giorni */
.cc-giorni{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px 4px;scroll-padding:16px}
.cc-giorni::-webkit-scrollbar{display:none}
.cc-g{flex:0 0 auto;width:54px;min-height:78px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cc-g .gs{font-size:11px;color:var(--mu);text-transform:capitalize}
.cc-g .gd{font-size:15px;font-weight:700;color:#fff;line-height:1.1}
.cc-g .gb{width:30px;height:26px;border-radius:5px;margin-top:3px;position:relative;overflow:hidden;background:#20252c;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.cc-g .gb i+i{border-top:1px solid rgba(0,0,0,.55)}
.cc-g .gb i{position:absolute;left:0;right:0;bottom:0;display:block}
.cc-g .gp{font-size:11px;color:var(--mu);font-variant-numeric:tabular-nums}
.cc-g[aria-pressed=true]{border-color:var(--ac);background:#0f2236;box-shadow:0 0 0 1px var(--ac)}
.cc-g[aria-pressed=true] .gp{color:#cfe6ff}
/* strati */
.cc-strati{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 10px;align-items:center}

.cc-chip{min-height:36px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);background:#15181d;color:var(--mu);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;position:relative}
.cc-chip::after{content:"";position:absolute;inset:-5px -2px}
.cc-chip[aria-pressed=true]{background:#13263a;border-color:#2b5b8a;color:#fff}
.cc-chip .pt{width:8px;height:8px;border-radius:50%;display:inline-block}
/* mappa */
.cc-mappa{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#05080c;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:contain}
.cc-mappa svg{display:block;width:100%;height:100%}

.cc-ctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.cc-ctl button,.cc-leg-b{width:44px;height:44px;border-radius:12px;border:1px solid #2a3038;background:rgba(17,20,25,.88);color:#cfe6ff;font-size:22px;font-weight:500;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cc-leg-b{position:absolute;left:8px;bottom:8px;width:auto;height:36px;padding:0 11px 0 8px;font-size:13px;font-weight:600;gap:6px;z-index:2;border-radius:18px}
.cc-leg-b::after{content:"";position:absolute;inset:-4px}
.cc-vb svg{display:block}
.cc-leg-b b{display:inline-flex;width:18px;height:18px;border-radius:50%;border:1.5px solid #9cc9ff;align-items:center;justify-content:center;font:700 11px/1 Georgia,serif;color:#9cc9ff}
.cc-titmap{position:absolute;left:0;top:0;right:0;z-index:1;pointer-events:none;font-size:12px;color:#c9d1d9;padding:9px 64px 22px 11px;background:linear-gradient(rgba(5,8,12,.88),rgba(5,8,12,.55) 65%,rgba(5,8,12,0));text-shadow:0 1px 2px #000}
.cc-titmap i{display:block;font-style:normal;color:#ffd9a0;margin-top:2px}
.cc-titmap b{display:block;font-size:14px;color:#fff}
.cc-lim{font-size:13px;color:var(--mu);margin:10px 2px 16px;line-height:1.45}
.cc-lim b{color:#c9d1d9}
/* sezioni */
.cc-sez{margin:18px 0 8px;font-size:17px;font-weight:700;color:#fff}
.cc-sez small{display:block;font-size:13px;font-weight:400;color:var(--mu);margin-top:2px}
.cc-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.cc-reg{display:flex;flex-direction:column;gap:6px}
.cc-r{display:grid;grid-template-columns:14px 1fr 46px;grid-template-areas:"d n p" ". b b";align-items:center;column-gap:10px;row-gap:6px;min-height:48px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:left}
.cc-r .dot{grid-area:d}.cc-r .nm{grid-area:n}.cc-r .bar{grid-area:b}.cc-r .pc{grid-area:p;font-size:15px!important;color:#e6e8eb!important;font-weight:600}
.cc-r .dot{width:12px;height:12px;border-radius:50%}
.cc-r .nm{font-weight:600;font-size:14px;line-height:1.25}
.cc-r .nm small{display:block;font-weight:400;color:var(--mu);font-size:12px}
.cc-r .bar{height:6px;border-radius:4px;background:#232830;overflow:hidden}
.cc-r .bar i{display:block;height:100%;border-radius:4px}
.cc-r .pc{font-size:13px;color:var(--mu);text-align:right;font-variant-numeric:tabular-nums}
.cc-r[aria-pressed=true]{border-color:var(--ac);background:#0f2236}
.cc-r.auto{grid-template-areas:"d n n"}
.cc-filtri{display:flex;flex-direction:column;gap:12px}
.cc-riga{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cc-lab{font-size:13px;color:var(--mu);width:100%}
.cc-range{display:flex;align-items:center;gap:10px}
.cc-range input{flex:1;height:44px;accent-color:var(--ac)}
.cc-range output{width:130px;text-align:right;font-size:13px;color:#cfe6ff;font-variant-numeric:tabular-nums}
.cc-tog{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:10px;font-size:14px;border:0;background:transparent;padding:0;width:100%;text-align:left}
.cc-tog .sw{width:50px;height:30px;border-radius:15px;background:#2a2f37;position:relative;flex:0 0 auto;transition:background .2s}
.cc-tog .sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.cc-tog[aria-pressed=true] .sw{background:#2f7fe0}
.cc-tog[aria-pressed=true] .sw::after{transform:translateX(20px)}
/* foglio dal basso */
.cc-velo{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.cc-velo.on{opacity:1;pointer-events:auto}
.cc-foglio{position:fixed;left:0;right:0;bottom:0;z-index:90;max-height:60vh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#12161b;border-top:1px solid #2b313a;border-radius:18px 18px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -12px 40px rgba(0,0,0,.6);max-width:720px;margin:0 auto}
.cc-foglio.on{transform:none;visibility:visible}
.cc-foglio:not(.on){visibility:hidden;transition:transform .28s,visibility 0s .3s}
.cc-maniglia{width:40px;height:5px;border-radius:3px;background:#3a414b;margin:4px auto 6px}
.cc-fx{position:sticky;top:0;float:right;width:44px;height:44px;border-radius:50%;border:0;background:#20252c;color:#cfd6de;font-size:22px;margin:-2px -6px 0 8px;z-index:2}
.cc-ft{font-size:20px;font-weight:700;color:#fff;margin:2px 0 2px;line-height:1.25}
.cc-fs{color:var(--mu);font-size:14px;margin:0 0 10px}
.cc-blocchi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.cc-bl{background:#191e25;border:1px solid #262c35;border-radius:12px;padding:9px 10px}
.cc-bl .k{font-size:12px;color:var(--mu)}
.cc-bl .v{font-size:18px;font-weight:700;color:#fff;line-height:1.25;display:flex;align-items:center;gap:6px}
.cc-bl .v small{font-size:12px;font-weight:500;color:var(--mu)}
.cc-p{margin:8px 0;font-size:15px;line-height:1.5}
.cc-p b{color:#fff}
.cc-elenco{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.cc-el{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px;border-radius:10px;background:#191e25;border:1px solid #262c35;text-align:left;width:100%}
.cc-el .sg{width:28px;height:6px;border-radius:3px;flex:0 0 auto}
.cc-el span{flex:1;font-size:14px;line-height:1.3}
.cc-el small{color:var(--mu);font-size:12px;white-space:nowrap}
.cc-tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:#20262e;color:#cfd6de;margin:0 4px 4px 0}
.cc-leg h4{margin:14px 0 6px;font-size:14px;color:#fff}
.cc-leg .lr{display:flex;align-items:center;gap:10px;font-size:13px;color:#c9d1d9;margin:5px 0}
.cc-leg svg{flex:0 0 auto}
/* modi */
.cc-mcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0 0}
.cc-mtop{display:flex;align-items:center;gap:8px}
.cc-mtop button{width:44px;height:44px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line2);background:#15181d;color:#cfe6ff;font-size:22px}
.cc-mtop .mt{flex:1;min-width:0;text-align:center}
.cc-mtop .mt b{display:block;font-size:17px;color:#fff;line-height:1.25}
.cc-mtop .mt small{font-size:12px;color:var(--mu)}
.cc-miniature{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px -12px 0;padding:2px 12px 4px}
.cc-miniature::-webkit-scrollbar{display:none}
.cc-mini{flex:0 0 auto;width:72px;border:1px solid var(--line);background:#0a0d11;border-radius:10px;padding:3px 3px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cc-mini canvas{width:64px;height:76px;display:block;border-radius:6px}
.cc-mini span{font-size:10.5px;color:#c9d1d9;line-height:1.15;text-align:center;height:2.3em;overflow:hidden}
.cc-mini[aria-pressed=true]{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac);background:#0f2236}
.cc-albero{display:grid;grid-template-columns:.9fr 1.1fr .95fr 1.1fr;gap:3px}
.cc-nodoal{border:1px solid #2a3038;border-radius:8px;background:#151a20;padding:6px 6px;font-size:12px;line-height:1.2;text-align:left;min-height:44px;display:flex;flex-direction:column;justify-content:flex-start;border-left-width:4px;overflow:hidden;color:#dfe4ea}
.cc-nodoal small{color:var(--mu);font-size:10.5px}
.cc-nodoal{overflow-wrap:normal;word-break:keep-all;font-size:11.5px;padding:6px 4px 6px 5px}
@media (max-width:380px){.cc-nodoal{font-size:10.5px;letter-spacing:-.25px;padding:6px 2px 6px 4px}.cc-chip{padding:0 9px;font-size:12.5px}.cc-strati{gap:4px}.cc-albero,.cc-albtit{gap:2px}}
.cc-nodoal canvas{width:100%;max-width:64px;height:auto;margin-top:8px;border-radius:5px;display:block}
.cc-nodoal[aria-pressed=true]{background:#0f2236;border-color:var(--ac);border-left-color:var(--ac);color:#fff}
.cc-albtit{display:grid;grid-template-columns:.9fr 1.1fr .95fr 1.1fr;gap:3px;margin:0 0 4px;font-size:11px;color:var(--mu);text-align:center}
.cc-mat{width:100%}
.cc-mat text{font-family:inherit}
.cc-nota{font-size:12.5px;color:var(--mu);margin:6px 0 0}
@media (prefers-reduced-motion: reduce){.cc *{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="modulo"></div>
<script>
/* =====================================================================
   montaCausalita(elemento, dati)
   dati = { causalita: <causalita.json>, modi: <modi.json>, cartina: <piemonte.json> }
   Disegna la sezione "Chi comanda il tempo" dentro elemento. Nessuna libreria esterna.
   ===================================================================== */
function montaCausalita(EL, DATI){
"use strict";
var C = DATI.causalita, MO = DATI.modi, K = DATI.cartina;
var NS = "http://www.w3.org/2000/svg";
var RIDUCI_TMP, RIDUCI = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var PR = K.proiezione, BOX = K.riquadro_km;
function proj(lat, lon){ return [(lon - PR.lon0) * PR.km_per_grado_lon, -(lat - PR.lat0) * PR.km_per_grado_lat]; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function num(x, d){ return (d == null ? Math.round(x) : x.toFixed(d)).toString().replace(".", ","); }
function pct(x){ return Math.round(x * 100) + " %"; }

/* ---------------- costanti grafiche ---------------- */
var VAR = {pioggia:{nome:"pioggia", col:"#4da3ff"}, temperatura:{nome:"temperatura", col:"#ff7466"}, vento:{nome:"vento", col:"#5fe0b6"}, umidita:{nome:"umidità e nebbia", col:"#cfd6de"}};
var RIT = [ {max:2, col:"#fff1a8", nome:"0–2 ore", dur:1.1}, {max:6, col:"#ffc23d", nome:"3–6 ore", dur:1.6}, {max:12, col:"#ff8336", nome:"7–12 ore", dur:2.2},
            {max:24, col:"#f2508c", nome:"13–24 ore", dur:3}, {max:1e9, col:"#b685ff", nome:"oltre 24 ore", dur:4} ];
function ritBin(h){ for (var i = 0; i < RIT.length; i++) if (h <= RIT[i].max) return i; return RIT.length - 1; }
var TIPO = {casa:"casa", stazione:"stazione al suolo", quota:"punto in quota (griglia dei modelli)", radar:"radar meteorologico", area:"area sorvegliata"};
var GSETT = ["dom","lun","mar","mer","gio","ven","sab"], GSETT_L = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
var MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
function dt(s){ var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function giornoLungo(i){ var d = dt(C.giorni[i].data); return GSETT_L[d.getDay()] + " " + d.getDate() + " " + MESI[d.getMonth()]; }
function bussola(g){ var n = ["nord","nord-est","est","sud-est","sud","sud-ovest","ovest","nord-ovest"]; return n[Math.round(((g % 360) + 360) % 360 / 45) % 8]; }
function forzaParola(f){ return f >= .6 ? "forte" : f >= .35 ? "media" : "debole"; }
function sicuroParola(s){ return s >= .85 ? "molto sicuro" : s >= .6 ? "abbastanza sicuro" : "incerto"; }
function ore(h){ return h <= 0 ? "meno di un'ora" : h == 1 ? "1 ora" : h < 48 ? num(h) + " ore" : "circa " + num(h / 24) + " giorni"; }

/* ---------------- indici dei dati ---------------- */
var NODI = {}, CASA = C.meta.casa_id;
C.nodi.forEach(function(n){ var p = proj(n.lat, n.lon); n.x = p[0]; n.y = p[1]; NODI[n.id] = n;
  var dx = n.x, dy = -n.y; n.dist = Math.hypot(dx, dy); n.dir = (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360; });
var REG = {}; C.regimi.forEach(function(r){ REG[r.id] = r; });
var ARCHI = C.archi; ARCHI.forEach(function(a, i){ a.i = i; });
var COMP = {}; MO.componenti.forEach(function(c){ COMP[c.id] = c; });
var PUNTI = MO.punti.map(function(p){ var q = proj(p.lat, p.lon); return {x:q[0], y:q[1]}; });

/* ---------------- stato ---------------- */
var S = { vista: "legami", giorno: 0, regime: null /* null = automatico */, variabile: "tutte", fmin: 0.15, soloCasa: false,
          strati: {legami: true, modo: false, rilievo: true, nomi: true}, livello: 8, modo: null, sel: null };

/* ---------------- struttura della pagina ---------------- */
EL.innerHTML = "";
var R = document.createElement("div"); R.className = "cc"; EL.appendChild(R);
R.innerHTML =
  '<div class="cc-h1">Chi comanda il tempo</div>' +
  '<p class="cc-sub">Quali luoghi attorno a casa anticipano il tempo che arriverà, e i modi ricorrenti del tempo in Piemonte.</p>' +
  (C.esempio || MO.esempio ? '<div class="cc-esempio" title="' + esc(C.avviso_esempio) + '">Dati di esempio: la grafica è vera, i numeri no</div>' : '') +
  '<div class="cc-seg" role="tablist"><button data-v="legami" aria-pressed="true">Chi anticipa casa</button><button data-v="modi" aria-pressed="false">Modi del tempo</button></div>' +
  '<div class="cc-frase" id="cc-frase"></div>' +
  '<div class="cc-giorni" id="cc-giorni" aria-label="Giorni della previsione"></div>' +
  '<div class="cc-strati" id="cc-strati"></div>' +
  '<div class="cc-mappa" id="cc-mappa"><svg id="cc-svg" aria-label="Cartina del Piemonte con i legami"></svg>' +
    '<div class="cc-titmap" id="cc-titmap"></div>' +
    '<div class="cc-ctl"><button id="cc-piu" aria-label="Ingrandisci">+</button><button id="cc-meno" aria-label="Rimpicciolisci">−</button><button id="cc-vista" aria-label="Dintorni di casa" class="cc-vb"></button></div>' +
    '<button class="cc-leg-b" id="cc-legb" aria-label="Legenda"><b>i</b>Legenda</button></div>' +
  '<div id="cc-sotto"></div>' +
  '<div class="cc-velo" id="cc-velo"></div><div class="cc-foglio" id="cc-foglio" role="dialog" aria-modal="false"></div>';
function $(id){ return R.querySelector("#" + id); }
var MAP = $("cc-mappa"), SVG = $("cc-svg"), FOGLIO = $("cc-foglio"), VELO = $("cc-velo");

/* ---------------- cartina di base (in km, trasformata come gruppo) ---------------- */
var W = 0, H = 0, s0 = 1, V = {k: 1, tx: 0, ty: 0};
var gBase, gOver, gField, imgField, imgOmbra;
function el(tag, at, par){ var e = document.createElementNS(NS, tag); for (var k in at) e.setAttribute(k, at[k]); if (par) par.appendChild(e); return e; }
function costruisciBase(){
  SVG.innerHTML = "";
  var defs = el("defs", {}, SVG);
  var cp = el("clipPath", {id: "cc-clip-pie"}, defs); el("path", {d: K.regioni["Piemonte"]}, cp);
  RIT.forEach(function(r, i){
    var m = el("marker", {id: "cc-fr" + i, viewBox: "0 0 10 10", refX: "8.5", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse", markerUnits: "userSpaceOnUse"}, defs);
    el("path", {d: "M0 0L10 5L0 10L2.5 5z", fill: r.col}, m);
  });
  el("rect", {x: 0, y: 0, width: "100%", height: "100%", fill: "#06101b"}, SVG); // mare
  gBase = el("g", {}, SVG);
  // terre emerse (stati) e regioni
  var colStati = {ITA: "#0b0e12", FRA: "#0a0c0f", CHE: "#0a0c0f", MCO: "#0a0c0f"};
  for (var s in K.stati) el("path", {d: K.stati[s], fill: colStati[s] || "#0a0c0f"}, gBase);
  el("path", {d: K.regioni["Piemonte"], fill: "#10151b"}, gBase);
  // fasce di quota: grigio-azzurro crescente
  var fcol = ["#141b23", "#18212b", "#1d2833", "#24303c", "#2e3a47"];
  var gF = el("g", {id: "cc-fasce"}, gBase);

/* ---------------- pannello sotto la mappa: modi ---------------- */
function disegnaMini(cv, id){
  var x = cv.getContext("2d"), w = cv.width, h = cv.height, box = PBOX, sc = Math.min(w / (box[2] - box[0]), h / (box[3] - box[1]));
  var ox = (w - (box[2] - box[0]) * sc) / 2, oy = (h - (box[3] - box[1]) * sc) / 2;
  x.fillStyle = "#0b0e12"; x.fillRect(0, 0, w, h);
  x.save(); x.translate(ox - box[0] * sc, oy - box[1] * sc); x.scale(sc, sc);
  var pa = new Path2D(K.regioni["Piemonte"]); x.fillStyle = "#151b22"; x.fill(pa); x.save(); x.clip(pa);
  var f = campo(id, 60, Math.round(60 * (box[3] - box[1]) / (box[2] - box[0])), box); x.drawImage(f.canvas, box[0], box[1], box[2] - box[0], box[3] - box[1]); x.restore();
  x.lineWidth = 1.2 / sc; x.strokeStyle = "#8a9bb0"; x.stroke(pa);
  x.fillStyle = "#fff"; x.beginPath(); x.arc(0, 0, 3 / sc, 0, 7); x.fill(); x.restore();
}
function pannelloModi(){
  var id = modoMostrato(), c = COMP[id], liv = S.livello, ids = MO.componenti.filter(function(m){ return m.livello == liv; }).map(function(m){ return m.id; });

  h += '<div style="font-size:13px;color:var(--mu);margin:6px 0 2px">Ultimi 45 giorni e prossimi 15</div><svg class="cc-mat" id="cc-serie" height="70"></svg>';
  h += '<div class="cc-miniature" id="cc-mini">' + ids.map(function(m){ return '<button class="cc-mini" data-m="' + m + '" aria-pressed="' + (m == id) + '"><canvas width="128" height="152"></canvas><span>' + esc(COMP[m].nome_breve) + '</span></button>'; }).join("") + '</div></div>';
  h += '<div class="cc-sez">Come si dividono i modi<small>tocca un riquadro per vederne la mappa</small></div><div class="cc-card" style="padding:8px">';
  h += '<div class="cc-albtit"><span>2 modi</span><span>4 modi</span><span>8 modi</span><span>16 modi</span></div><div class="cc-albero" id="cc-albero"></div></div>';
  var lt = liv == 16 ? 8 : liv == 2 ? 4 : liv;

  $("cc-sotto").innerHTML = h;
  $("cc-liv").querySelectorAll("button").forEach(function(b){ b.onclick = function(){ var l = +b.getAttribute("data-l"); var cur = COMP[modoMostrato()]; S.livello = l; // conservo la parentela
      var cand = MO.componenti.filter(function(m){ return m.livello == l && (m.id.indexOf(cur.id) == 0 || cur.id.indexOf(m.id) == 0); }); S.modo = S.modo && cand.length ? cand[0].id : null; aggiornaTutto(); }; });
  $("cc-mprev").onclick = function(){ S.modo = ids[(k - 1 + ids.length) % ids.length]; aggiornaTutto(); };
  $("cc-mnext").onclick = function(){ S.modo = ids[(k + 1) % ids.length]; aggiornaTutto(); };
  $("cc-mini").querySelectorAll(".cc-mini").forEach(function(b){ disegnaMini(b.querySelector("canvas"), b.getAttribute("data-m")); b.onclick = function(){ S.modo = b.getAttribute("data-m"); aggiornaTutto(); }; });
  var sel = $("cc-mini").querySelector('[aria-pressed="true"]'); if (sel) sel.scrollIntoView({block: "nearest", inline: "center"});
  serie(id); albero(id); transizioni(lt, id);

function serie(id){
  var sv = $("cc-serie"), w = sv.clientWidth || 320, h = 70, A = MO.attivazione_recente, P = MO.previsione, n = A.valori.length + P.probabilita.length, bw = w / n, c = COMP[id], s = "";
  function val(v, ord){ var t = 0; ord.forEach(function(o, j){ if (o.indexOf(id) == 0) t += v[j]; }); return t; }

  var xo = A.valori.length * bw; s += '<line x1="' + xo + '" x2="' + xo + '" y1="2" y2="' + (h - 14) + '" stroke="#fff" stroke-dasharray="2 2" opacity=".6"/>';
  s += '<line x1="0" x2="' + w + '" y1="' + (h - 16) + '" y2="' + (h - 16) + '" stroke="#2a3038"/>';

function albero(id){

    });
  });

  A.querySelectorAll(".cc-nodoal").forEach(function(b){ b.onclick = function(){ var m = b.getAttribute("data-m"); S.livello = COMP[m].livello; S.modo = m; S.strati.modo = true; aggiornaTutto(); MAP.scrollIntoView({behavior: RIDUCI ? "auto" : "smooth", block: "start"}); }; });
}
function transizioni(liv, idSel){
  var T = MO.transizioni[String(liv)], ord = T.ordine, M = T.matrice, n = ord.length, sv = $("cc-trans"), w = sv.clientWidth || 320;
  var lab = Math.min(118, w * .36), cw = (w - lab - 4) / n, top = 30, h = top + n * Math.max(cw, 30) + 4, ch = (h - top - 4) / n;
  var cur = ord.filter(function(o){ return idSel.indexOf(o) == 0 || o.indexOf(idSel) == 0; })[0];
  var maxOff = 0; M.forEach(function(r, i){ r.forEach(function(p, j){ if (i != j) maxOff = Math.max(maxOff, p); }); });
  var s = "";
  ord.forEach(function(o, j){ var x = lab + cw * (j + .5); s += '<circle cx="' + x + '" cy="10" r="5" fill="' + COMP[o].colore + '"/><text x="' + x + '" y="26" font-size="10.5" fill="#8b949e" text-anchor="middle">' + (j + 1) + '</text>'; });
  ord.forEach(function(o, i){
    var y = top + ch * i, on = o == cur;
    if (on) s += '<rect x="0" y="' + y + '" width="' + w + '" height="' + ch + '" fill="#0f2236" rx="6"/>';
    s += '<circle cx="7" cy="' + (y + ch / 2) + '" r="4.5" fill="' + COMP[o].colore + '"/><text x="16" y="' + (y + ch / 2 + 4) + '" font-size="12" fill="' + (on ? "#fff" : "#c9d1d9") + '">' + (i + 1) + ' ' + esc(COMP[o].nome_breve).slice(0, 15) + '</text>';
    M[i].forEach(function(p, j){
      var x = lab + cw * (j + .5), yc = y + ch / 2, rmax = Math.min(cw, ch) * .46;
      if (i == j){ s += '<circle cx="' + x + '" cy="' + yc + '" r="' + rmax.toFixed(1) + '" fill="none" stroke="#6e7781" stroke-width="1.2" stroke-dasharray="2 2"/><text x="' + x + '" y="' + (yc + 3.5) + '" font-size="10" fill="#9aa4b2" text-anchor="middle">' + Math.round(p * 100) + '</text>'; return; }
      var r = Math.sqrt(p / maxOff) * rmax;
      s += '<circle cx="' + x + '" cy="' + yc + '" r="' + Math.max(1.3, r).toFixed(1) + '" fill="' + COMP[ord[j]].colore + '" opacity="' + (p < .02 ? .35 : .95) + '"/>';
      if (r > 9.5) s += '<text x="' + x + '" y="' + (yc + 3.5) + '" font-size="10" font-weight="700" fill="#06101b" text-anchor="middle">' + Math.round(p * 100) + '</text>';
    });
  });
  sv.setAttribute("viewBox", "0 0 " + w + " " + h); sv.setAttribute("height", h); sv.innerHTML = s;
  var i = ord.indexOf(cur), riga = M[i].map(function(p, j){ return {p: p, j: j}; }).filter(function(o){ return o.j != i; }).sort(function(a, b){ return b.p - a.p; }).slice(0, 2);
  $("cc-tnota").innerHTML = 'Sulla diagonale (cerchio tratteggiato) la probabilità di <b style="color:#c9d1d9">restare</b> nello stesso modo; i cerchi colorati, in scala propria, i passaggi a un altro modo. Dopo <b style="color:#fff">«' + esc(COMP[cur].nome_breve) + '»</b> resta lo stesso modo nel ' + pct(M[i][i]) + ' dei casi (dura in media ' + num(COMP[cur].durata_tipica_giorni, 1) + ' giorni); se cambia, di solito arriva ' + riga.map(function(o){ return '«' + esc(COMP[ord[o.j]].nome_breve) + '» (' + pct(o.p) + ')'; }).join(" o ") + '.';
}

/* ---------------- inquadratura automatica sui legami visibili ---------------- */
function inquadra(){
  var box;
  if (S.strati.legami){
    var L = archiVisibili(), ids = {}, soglia = Math.max(.45, S.fmin); ids[CASA] = 1;
    L.forEach(function(a){ if (a.forza >= soglia || L.length < 8) ids[a.da] = ids[a.a] = 1; });
    var xs = [], ys = []; Object.keys(ids).forEach(function(id){ xs.push(NODI[id].x); ys.push(NODI[id].y); });
    box = [Math.min.apply(0, xs), Math.min.apply(0, ys), Math.max.apply(0, xs), Math.max.apply(0, ys)];
    var cx = (box[0] + box[2]) / 2, cy = (box[1] + box[3]) / 2, w = Math.max(70, (box[2] - box[0]) * 1.25), h = Math.max(70, (box[3] - box[1]) * 1.25);
    box = [cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2];
    // non oltre il Piemonte intero
    if (w > CORNICE[2] - CORNICE[0] || h > CORNICE[3] - CORNICE[1]) box = CORNICE;
  } else box = CORNICE;
  // spazio per il titolo in alto
  var hh = box[3] - box[1]; box = [box[0], box[1] - hh * .16, box[2], box[3] + hh * .04];
  vistaInsieme(box, true);
}
/* ---------------- aggiornamento generale ---------------- */

  var gs = $("cc-giorni").querySelector('[aria-pressed="true"]'); if (gs){ var bx = $("cc-giorni"); var l = gs.offsetLeft - bx.clientWidth / 2 + gs.clientWidth / 2; bx.scrollLeft = Math.max(0, l); }
}
R.querySelectorAll(".cc-seg[role=tablist] button").forEach(function(b){ b.onclick = function(){

var stile = document.createElement("style"); stile.textContent = "@keyframes cc-scorri{to{stroke-dashoffset:-22}} .cc-pulse{transform-box:fill-box;transform-origin:center;animation:cc-pulsa 2.4s ease-out infinite} @keyframes cc-pulsa{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.5)}}"; R.appendChild(stile);

costruisciBase(); misura(); vistaInsieme(CORNICE, false); aggiornaTutto(); RIDUCI_TMP = RIDUCI; RIDUCI = true; inquadra(); RIDUCI = RIDUCI_TMP;
var wPrec = W;

return { scala: function(){ return V.k; }, stato: S, ridisegna: function(){ aggiornaTutto(true); }, nodiSchermo: function(){ var r = SVG.getBoundingClientRect(); return CACHE.nodi.map(function(o){ return {x: r.left + o.n.px, y: r.top + o.n.py}; }); }, schermo: function(id){ var r = SVG.getBoundingClientRect(), n = NODI[id]; return {x: r.left + (n.px != null ? n.px : sx(n.x)), y: r.top + (n.py != null ? n.py : sy(n.y))}; }, vista: function(v){ S.vista = v; aggiornaTutto(); } };
}
